  - uid: 1015
    components:
    - type: Transform
      pos: -17.555958,4.5653496
      parent: 1
    - type: Paper
      stampState: paper_stamp-ce
      stampedBy:
      - reapply: False
        stampType: RubberStamp
        stampedColor: '#C69B17FF'
        stampedName: stamp-component-stamped-name-ce
      content: " [color=#7c00ee]Engineering Report:[/color] Galilei Enforcer\n  ────────────────────────────────────\n\nLook, don't get me wrong, crew, I trust you. You'll be in here for a test run, don't tell the boss yet about the new ship.\n \nAfter the other guy threw away all of the scraps from the last few drones from NOV-Naonis I started digging through databanks and whatever the retrofitting crew was throwing out, I passed some of the data to one of our guys working on encryption.\n\nBoom, just like that, we managed to get a pristine encryption key. Apparently, the drones can call upon something heavier from the arsenal of the shipyard. Don't ask me why a  mere drone could call upon more things from that place, but it seems that the key was still valid, and we asked the old nerds to see if they had one of the catalogues from the System. Of course we tried to get one of the priciest things in the catalogue, and it resulted in... this. The Galilei. I have no idea why the System makes builds such a monster, it's simply something that NOV-Naonis doesn't produce as often. They specialize in research, but this kind of firepower would make entire fleets tremble.  They advertise selling maybe one or two of those each cycle, but who the hell do buys something like this anyway? For a thing of this size, the Galilei can be anything. A boarding ship, an anchor, a fleet destroyer, a can opener... It's boasting a firepower that's frankly absurd and shouldn't be made commercially available.\nWord is the automated system usually auto-denies purchase requests for these hulls, so why it accepted a request routed from a lone drone is beyond me.\n\nAnyway, to cut it short, when we used that key to get this monster, we were afraid that it was entirely automated, so we called it into a debris field in case we needed to pull up the EMP trick again and run for our lives. Yet... It just warped in the system, drifted into position, loyal as a dog. \n\nI checked it over, and everything seems up to spec. I'm not even sure if the countermeasures The System usually bakes into its ships are active here. Frankly, I wouldn't even know where to start looking. The underbelly of this ship is so complex I don't think the crew who refitted the Falena could make heads or tails of it.\n\nJust... when you guys take the wheel, be careful, alright? We don't want to draw attention from fish bigger than us. This thing can burn through a freelancer ship without breaking a sweat, and while we might hold our ground against another behemoth like this, if more start showing up, we'd better start running. Fast."
    - type: SolutionContainerManager
      solutions: null
      containers:
      - food
    - type: ContainerContainer
      containers:
        solution@food: !type:ContainerSlot
          ent: 1016
