- proto: PaperNanoTaskItem
  entities:
  - uid: 390
    components:
    - type: Transform
      pos: -1.9654508,-1.5912013
      parent: 1
    - type: Paper
      content: >-
        [color=#7c00ee]Retrofitting report: Falena Drones[/color]


        ──────────────────────────────────────


        Hooked her up to the overhead winches earlier this day, she's still humming at that sickening 60 Hz frequency all drones from The System emits when you sever their uplinks. Don't know if she's screaming or desperately attempting to reconnect to the damn thing. It's a good thing our crew can snatch lone ones out of Naonis because we would never be able to get near the main shipyard.


        Snatching crew managed to catch her near a debris field, apparently the shipyard deemed it interesting enough to send a drone there, we barely blew out the starboard thrusters with an EMP pulse.


        Gutted out the main computational banks, you would think that in five hundred years the machine mind would make these things look complex on the inside, but it's all computational racks, coolant pipes and a lot of optical nerves inside the hull. Three tons of pure processing hardware gutted out like a fish.  The boss will sell the scrap to the salvage dealer for a sweet bonus.

        We installed life support and a new generator where the old brain used to fit, welded up some steel where the old batteries used to stay to get some nice and cozy holding cells. You can still hear sometimes some logic gates clicking under the floorboards, but I am sure that it's not just residual activity.


        Not the greatest retrofitting job I had. Not the prettiest, not the ugliest, but she flies and we can get some nicer hardware for our fleet going. I am sure the boss will be proud.
    - type: SolutionContainerManager
      solutions: null
      containers:
      - food
    - type: ContainerContainer
      containers:
        solution@food: !type:ContainerSlot
          ent: 391
