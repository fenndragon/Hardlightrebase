- type: markingPoints
  id: MobDionaMarkingLimits
  onlyWhitelisted: true
  points:
    Hair:
      points: 0
      required: false
    FacialHair:
      points: 0
      required: false
    Head:
      points: 4 # WOLFGATE(Species): was 2, more marking slots
      required: false
    HeadTop:
      points: 1
      required: false
    HeadSide:
      points: 3
      required: false
    UndergarmentTop:
      points: 3
      required: false
    UndergarmentBottom:
      points: 3
      required: false
    Chest:
      points: 4 # WOLFGATE(Species): was 1, more marking slots
      required: false
    Legs:
      points: 8 # imp/mono 2<8
      required: false
    Arms:
      points: 8 # imp/mono 2<8
      required: false
    Overlay:
      points: 1
      required: true
      defaultMarkings: [ DionaVineOverlay ]

