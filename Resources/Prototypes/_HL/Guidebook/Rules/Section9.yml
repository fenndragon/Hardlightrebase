# Section 9: Erotic-Role-Play (ERP) Rules

- type: serverRule
  id: ServerRule9_1
  section: 9
  code: 9.1
  text: "ERP does not take priority over your job. If you are requested or needed, you must respond or return to your duties ASAP."

- type: serverRule
  id: ServerRule9_2
  section: 9
  code: 9.2
  text: "DO NOT use ERP as bait for kill objectives, unless done with OOC consent of all parties involved. After the ERP is complete, a grace period of 5 minutes is in effect, during which you are still NOT allowed to kill the target."

- type: serverRule
  id: ServerRule9_3
  section: 9
  code: 9.3
  text: "Do not kinkshame."

- type: serverRule
  id: ServerRule9_4
  section: 9
  code: 9.4
  text: "You MUST use the (-) subtle command for any and all erotic roleplay material."

- type: serverRule
  id: ServerRule9_5
  section: 9
  code: 9.5
  text: "Do not spam or pollute radio channels (including the telepath channel) with NSFW topics. Mind you, this does NOT mean that you are not allowed to speak or discuss such. There should not be a cringy spamfest of: shitposting, hornyposting, or depression posting."

- type: serverRule
  id: ServerRule9_6
  section: 9
  code: 9.6
  text: "Do not engage in, nor discuss, ‘extreme’ sexual fetishes in public. Public includes: any radio channel (including the telepath channel), out loud speech or overt actions in actual public physical locations, or doing so on camera."

- type: serverRule
  id: ServerRule9_7
  section: 9
  code: 9.7
  hardlit: Hardlit
  text: "Engaging in ERP with a non-sentient creature is prohibited. The creature must be player-controlled; consent in OOC, and pass the Harkness test in-character."

- type: serverRule
  id: ServerRule9_8
  section: 9
  code: 9.8
  hardlit: Hardlit
  text: "When roleplaying another person's character, OOC consent from the original (the owner of said character) is required before you engage in ERP."

- type: serverRule
  id: ServerRule9_9
  section: 9
  code: 9.9
  hardlit: Hardlit
  text: "Be very mindful of in-character and out-of-character consent. If your (out-of-character) OOC consent is not respected, immediately Ahelp or open a ticket."

- type: serverRule
  id: ServerRule9_10
  section: 9
  code: 9.10
  text: "Extreme acts like snuff, abuse, noncon, and other extreme kinks are only allowed if all parties consented OOC, Ahelp if you need clarification (Keep it private)."
