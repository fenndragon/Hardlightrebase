# Section 13: Ship saving

- type: serverRule
  id: ServerRule13_1
  section: 13
  code: 13.1
  text: "Ships are to be no larger than 80x50 tiles."

- type: serverRule
  id: ServerRule13_2
  section: 13
  code: 13.2
  text: "Do not abuse the ship save mechanic to avoid in-character consequences."

- type: serverRule
  id: ServerRule13_3
  section: 13
  code: 13.3
  hardlit: Hardlit
  text: "Do not exploit the stash to duplicate items. This especially goes for contraband."

- type: serverRule
  id: ServerRule13_4
  section: 13
  code: 13.4
  hardlit: Hardlit
  text: "Do not use inventories to circumvent stash restrictions."

- type: serverRule
  id: ServerRule13_5
  section: 13
  code: 13.5
  text: "Ship saving backups are only to be used in the event of ship destruction or loss due to a server crash or other unforseen issue. Loading backups otherwise is only to be done with admin permission."

- type: serverRule
  id: ServerRule13_6
  section: 13
  code: 13.6
  hardlit: Hardlit
  text: "Do not under any circumstances modify a ship save file without admin permission (like with the engine update)."

- type: serverRule
  id: ServerRule13_7
  section: 13
  code: 13.7
  hardlit: Hardlit
  text: "Do not go afk for extended periods on your ship (like logging off to sleep). The ship saving is provided to allow people to save progress without the need to do this. UNATTENDED SHIPS WILL BE REMOVED."

- type: serverRule
  id: ServerRule13_8
  section: 13
  code: 13.8
  hardlit: Hardlit
  text: "DO NOT ADD MORE THAN ONE BLUESPACE STASH PER SHIP."

- type: serverRule
  id: ServerRule13_9
  section: 13
  code: 13.9
  hardlit: Hardlit
  text: "The larger the ship, the more docking ports it must have. It is your responsibility to find a way to minimize your docking impact as best as possible, as to avoid one ship taking up the entirety of 3 docks. For those seeking to build larger ships, you are strongly encouraged to build a public throughway to aid in ease of docking."

- type: serverRule
  id: ServerRule13_10
  section: 13
  code: 13.10
  hardlit: Hardlit
  text: "Atmos tanks are limited to no larger than 40 tiles. Be it a 10x4 tank or some other configuration, the maximum tile count is a hard 40 per tank."
  description: |-
    Only one tank per gas type per ship.
    All atmospheric tanks must be hard-walled or glassed in. They may not be run by directional fans.
    No sub-framing to contain more gas than the space should normally hold.

- type: serverRule
  id: ServerRule13_11
  section: 13
  code: 13.11
  hardlit: Hardlit
  text: "Emitter shields are not to be used as ship shields - that is what actual ship shields are for. The only time emitter shields should be on a ship is to contain a tesla power source."

- type: serverRule
  id: ServerRule13_12
  section: 13
  code: 13.12
  hardlit: Hardlit
  text: "Ships are not to be enclosed with Directional Fans. Those are allowed for external access points or specialty rooms only, such as:"
  description: |-
    • Docking points
    • Thruster access points
    • Salvage bays
    • Any other point that has intended external access
    • Cold rooms
    • Artifact chambers

    This means putting them under doors/blastdoors/airlocks/docking points is fine if they are for external access or the other mentioned use cases. All walls should be clear of Directional Fans - enclosing your ship in them will be considered Power Gaming and will be removed and noted.

- type: serverRule
  id: ServerRule13_13
  section: 13
  code: 13.13
  hardlit: Hardlit
  text: "Your ship cannot be a square or rectangle in shape. Its IFF signature must be unique and at least somewhat geometrically broken up in some fashion. No flying space bricks or tubes. Break up your ship's shape to at least some degree to make it uniquely identifiable at a glance."

- type: serverRule
  id: ServerRule13_14
  section: 13
  code: 13.14
  hardlit: Hardlit
  text: "All armored hulls are to be no thicker than 3 layers deep. Noses of ships have a small amount of leeway here for aesthetic purposes."

- type: serverRule
  id: ServerRule13_15
  section: 13
  code: 13.15
  hardlit: Hardlit
  text: "All thrusters must be exposed to space, guarded only by grilles."
  description: |-
    Chuted thrusters may be set back no deeper than 5 tiles into a chute, with no more than 3 full tiles of grilles in front of them. An additional Half-Grille may be added if it makes sense for aesthetic purposes.
    Angled chutes are fine so long as they abide by the depth rule, and are guarded by a hard limit of no more than 3 grilles.
    Thrusters cannot be stacked in chutes. Each chute should contain a single thruster only - small, medium, or large.
    Nacelles can be made, so long as the thrusters can still be shot at and are only covered by grilles.
