# Section 4: New-Life Rules

- type: serverRule
  id: ServerRule4_1
  section: 4
  code: 4.1
  text: "Players maintain all in-character memory up until going critical provided they do not die."

- type: serverRule
  id: ServerRule4_2
  section: 4
  code: 4.2
  text: "If a player is brought back to life after death, they cannot recall how they died. This means they will not know the killer, or be able to utilize meta information about their death."

- type: serverRule
  id: ServerRule4_3
  section: 4
  code: 4.3
  hardlit: Hardlit
  text: "If a player respawns as the same character they cannot remember anything that happened in the previous life, equipment/owned items may be recovered, but otherwise they forget everything."
