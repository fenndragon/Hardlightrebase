- type: entity
  parent: BaseVendingMachineRestock
  id: VendingMachineRestockPassionDrobe
  name: PassionDrobe restock box
  description: A box containing various "naughty" toys, accessories, and drugs. Can be used to restock a PassionDrobe vending machine.
  components:
  - type: VendingMachineRestock
    canRestock:
    - passionDrobeInventory
  - type: Sprite
    sprite: _HL/Objects/Specific/Service/vending_machine_restock.rsi
    layers:
    - state: base
    - state: green_bit
      shader: unshaded
    - state: refill_passiondrobe

#HL This is the restock box for the SprayVend
- type: entity
